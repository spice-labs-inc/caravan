name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: caravan-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: caravan-macos-aarch64.dmg
    steps:
      - uses: actions/checkout@v5

      - name: Validate version tag
        env:
          # tag_name is "vX.Y.Z" (no refs/tags/ prefix) for the release event.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match pattern v*.*.* (got: ${TAG_NAME})" >&2
            exit 1
          fi
        id: version

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARAVAN_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/caravan dist/caravan
          chmod +x dist/caravan
          tar -czf dist/${{ matrix.artifact }} -C dist caravan
          rm dist/caravan

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS .app bundle + DMG)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Caravan.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp target/${{ matrix.target }}/release/caravan "$APP/Contents/MacOS/caravan"
          chmod +x "$APP/Contents/MacOS/caravan"

          # Convert PNG icon to icns
          mkdir -p caravan.iconset
          sips -z 16 16     assets/icon.png --out caravan.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out caravan.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out caravan.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out caravan.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out caravan.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out caravan.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out caravan.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out caravan.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out caravan.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out caravan.iconset/icon_512x512@2x.png
          iconutil -c icns caravan.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # Info.plist
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Caravan</string>
            <key>CFBundleDisplayName</key>
            <string>Caravan</string>
            <key>CFBundleIdentifier</key>
            <string>dev.caravan.app</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundleExecutable</key>
            <string>caravan</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          PLIST

          # Create DMG with drag-to-Applications
          create-dmg \
            --volname "Caravan" \
            --volicon "$APP/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Caravan.app" 150 185 \
            --app-drop-link 450 185 \
            --hide-extension "Caravan.app" \
            "dist/${{ matrix.artifact }}" \
            "dist/Caravan.app"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

